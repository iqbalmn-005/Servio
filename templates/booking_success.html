<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#FFF1EB;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#fff;
    padding:40px 30px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
    width:min(450px,100%);
}

h1{
    color:#F95C19;
    margin-bottom:15px;
    font-size:2rem;
}

p{
    color:#555;
    font-size:1rem;
    line-height:1.6;
    margin-bottom:8px;
}

.btn-group{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:25px;
}

.btn{
    flex:1;
    padding:12px 20px;
    background:#F95C19;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s ease;
    text-align:center;
}

.btn:hover{
    background:#d84a12;
}

/* Tablets */
@media (max-width:768px){
    .card{
        padding:35px 25px;
    }

    h1{
        font-size:1.8rem;
    }
}

/* Mobile */
@media (max-width:576px){

    .card{
        padding:30px 20px;
    }

    h1{
        font-size:1.5rem;
    }

    p{
        font-size:0.95rem;
    }

    .btn-group{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

/* Small phones */
@media (max-width:360px){

    h1{
        font-size:1.3rem;
    }

    p{
        font-size:0.9rem;
    }

    .card{
        padding:25px 15px;
    }
}
</style>

</head>

<body>

<div class="card">
    <h1>Booking Confirmed ✅</h1>

    <p>Your booking request has been sent successfully.</p>
    <p>Waiting for the provider to accept your request.</p>

    <div class="btn-group">
        <a href="/logined/" class="btn">Back to Home</a>
        <a href="{% url 'booking_status' %}" class="btn">View Booking Status</a>
    </div>
</div>

</body>
</html>
