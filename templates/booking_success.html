<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>

<style>
body{
font-family:Arial, sans-serif;
background:#FFF1EB;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
padding:16px;
box-sizing:border-box;
}

.card{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
text-align:center;
max-width:450px;
width:100%;
}

h1{
color:#F95C19;
margin-bottom:15px;
}

p{
color:#555;
font-size:16px;
}

.btn-group{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-top:20px;
}

.btn{
display:inline-block;
padding:12px 20px;
background:#F95C19;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
transition:background 0.2s;
flex:1;
min-width:140px;
text-align:center;
}

.btn:hover{
background:#d84a12;
}

@media (max-width: 576px) {
    body {
        padding: 12px;
    }
    .card {
        padding: 28px 20px;
    }
    h1 {
        font-size: 22px;
    }
    p {
        font-size: 14px;
    }
    .btn-group {
        flex-direction: column;
    }
    .btn {
        width: 100%;
        min-width: unset;
    }
}
</style>

</head>

<body>

<div class="card">
<h1>Booking Confirmed ✅</h1>
<p>Your booking request has been sent successfully.</p>
<p>Waiting for the provider to accept your request.</p>

<div class="btn-group">
<a href="/logined/" class="btn">Back to Home</a>
<a href="{% url 'booking_status' %}" class="btn">View Booking Status</a>
</div>
</div>

</body>
</html>
